<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magic Particles - Doodle Deck</title>
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Comic Neue', cursive;
            background-color: #050505;
            color: white;
            overflow: hidden;
            height: 100vh;
        }

        /* Header */
        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.5);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(10px);
            z-index: 100;
        }

        #top-header h1 {
            margin: 0;
            font-size: 1.8rem;
            color: #00ffff;
            text-shadow: 0 0 20px #00ffff, 0 0 40px #00ffff;
        }

        #top-header p {
            margin: 0;
            font-size: 0.9rem;
            color: #ccc;
        }

        nav {
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
        }

        .nav-link {
            text-decoration: none;
            color: #00ffff;
            font-weight: bold;
            padding: 0.4rem 0.8rem;
            border-radius: 15px;
            background: rgba(0, 255, 255, 0.05);
            border: 1px solid rgba(0, 255, 255, 0.2);
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        .nav-link:hover, .nav-link.active {
            background: rgba(0, 255, 255, 0.15);
            border-color: #00ffff;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        /* Canvas Container */
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        /* Video Preview */
        #video {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 160px;
            height: 120px;
            border-radius: 10px;
            border: 2px solid #00ffff;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.5);
            opacity: 0.7;
            z-index: 50;
            transform: scaleX(-1);
            display: none;
        }

        /* Controls */
        #controls {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            padding: 1rem 1.5rem;
            border-radius: 25px;
            z-index: 100;
            backdrop-filter: blur(10px);
            border: 2px solid #00ffff;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.4), inset 0 0 20px rgba(0, 255, 255, 0.1);
            max-width: 90vw;
        }

        .control-row {
            display: flex;
            gap: 0.8rem;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 0.5rem;
        }

        .control-row:last-child {
            margin-bottom: 0;
        }

        .control-label {
            font-size: 0.9rem;
            color: #00ffff;
            font-weight: bold;
        }

        .shape-btn, .mode-btn {
            background: rgba(0, 255, 255, 0.05);
            border: 2px solid rgba(0, 255, 255, 0.3);
            color: #00ffff;
            padding: 0.4rem 0.8rem;
            border-radius: 12px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.95rem;
            transition: all 0.2s ease;
            font-weight: bold;
        }

        .shape-btn:hover, .mode-btn:hover {
            background: rgba(0, 255, 255, 0.15);
            border-color: #00ffff;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.4);
            transform: scale(1.05);
        }

        .shape-btn.active, .mode-btn.active {
            background: #00ffff;
            color: #050505;
            border-color: #00ffff;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.8), inset 0 0 10px rgba(0, 255, 255, 0.3);
        }

        #status {
            text-align: center;
            color: #00ffff;
            font-size: 0.9rem;
            margin-top: 0.5rem;
            font-weight: bold;
            text-shadow: 0 0 10px currentColor, 0 0 20px currentColor;
            letter-spacing: 0.5px;
        }

        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 0.5rem;
                padding: 0.8rem;
            }
            
            #top-header h1 {
                font-size: 1.3rem;
            }
            
            nav {
                font-size: 0.8rem;
            }
            
            .shape-btn, .mode-btn {
                font-size: 0.85rem;
                padding: 0.3rem 0.6rem;
            }
        }
    </style>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <!-- MediaPipe Hands for precise tracking -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>
    <header>
        <div id="top-header">
            <h1>✨ Magic Particles</h1>
            <p>🤚 Move your hand slowly to control the magic!</p>
        </div>
        <nav>
            <a href="../index.html" class="nav-link">🏠 Home</a>
            <a href="../text-editor/index.html" class="nav-link">✏️ Text Editor</a>
            <a href="../color-mixer/index.html" class="nav-link">🎨 Color Mixer</a>
            <a href="../paint-canvas/index.html" class="nav-link">🖌️ Paint Canvas</a>
            <a href="index.html" class="nav-link active">✨ Particles</a>
            <a href="../alphabet-pangram/index.html" class="nav-link">🔤 Alphabet Adventure</a>
            <a href="../number-bingo/index.html" class="nav-link">🔢 Number Bingo</a>
        </nav>
    </header>

    <video id="video"></video>
    <div id="canvas-container"></div>

    <div id="controls">
        <div class="control-row">
            <span class="control-label">Shape:</span>
            <button class="shape-btn" data-shape="heart">❤️ Heart</button>
            <button class="shape-btn" data-shape="flower">🌸 Flower</button>
            <button class="shape-btn" data-shape="saturn">🪐 Saturn</button>
            <button class="shape-btn" data-shape="fireworks">🎆 Fireworks</button>
            <button class="shape-btn" data-shape="sphere">⭐ Sphere</button>
        </div>
        <div class="control-row">
            <span class="control-label">Mode:</span>
            <button class="mode-btn active" data-mode="auto">🔄 Auto-Morph</button>
            <button class="mode-btn" data-mode="manual">👆 Manual</button>
        </div>
        <div id="status">Loading camera...</div>
        <div style="text-align: center; margin-top: 0.5rem; font-size: 0.8rem; color: rgba(0, 255, 255, 0.6); line-height: 1.5;">
            🔄 <strong style="color: #00ffff;">Turn your hand slowly</strong> to spin the magic<br>
            ✋ <strong style="color: #00ff88;">Open hand</strong> = Bigger | ✊ <strong style="color: #00ffff;">Close hand</strong> = Smaller
        </div>
    </div>

    <script src="particle-system.js"></script>
</body>
</html>
